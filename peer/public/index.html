<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Pi Cam</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0a0a0a;
      color: #eee;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
      padding: 1rem;
      gap: 1rem;
    }

    h1 {
      font-size: 1.2rem;
      letter-spacing: 0.05em;
      opacity: 0.7;
    }

    #status {
      font-size: 0.85rem;
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      background: #222;
    }

    #status.connected {
      background: #14532d;
      color: #4ade80;
    }

    #networkMode {
      font-size: 0.8rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      background: #222;
      color: #aaa;
    }

    #networkMode.turn {
      background: #3b2f0a;
      color: #facc15;
    }

    #networkMode.p2p {
      background: #0f3a2e;
      color: #34d399;
    }

    #status.error {
      background: #450a0a;
      color: #f87171;
    }

    #deviceStatus {
      font-size: 0.8rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      background: #222;
      color: #aaa;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    #deviceStatus::before {
      content: "";
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: #777;
    }

    #deviceStatus.online {
      background: #14532d;
      color: #4ade80;
    }

    #deviceStatus.online::before {
      background: #4ade80;
    }

    #deviceStatus.offline {
      background: #450a0a;
      color: #f87171;
    }

    #deviceStatus.offline::before {
      background: #f87171;
    }

    #deviceStatus.unknown::before {
      background: #777;
    }

    #videoContainer {
      position: relative;
      width: 100%;
      max-width: 640px;
    }

    video {
      width: 100%;
      height: auto;
      background: #111;
      border-radius: 0.75rem;
      object-fit: contain;
      display: block;
    }

    /* Fake fullscreen: we fullscreen the whole <html> (see fullscreenBtn) and
       expand the container with this body class instead of making the <video>
       the fullscreen element. If the video were the fullscreen subject, Chrome
       promotes it to a hardware overlay plane that hides the watermark. */
    body.fs #videoContainer {
      position: fixed;
      inset: 0;
      max-width: none;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body.fs #videoContainer video {
      max-height: 100vh;
      border-radius: 0;
      /* Make the video INELIGIBLE for Chrome's DirectComposition hardware
         overlay plane, which otherwise composites above all DOM and hides the
         watermark after 1-2 s. A sub-1 opacity (visually identical) forces the
         video onto a normal GPU layer where the watermark's z-index wins.
         See https://issues.chromium.org/issues/40900941 */
      opacity: 0.999;
    }

    .watermark {
      position: absolute;
      right: 10px;
      bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.4);
      opacity: 0.8;
      pointer-events: none;
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      color: #fff;
      z-index: 2147483647;
      /* Force our own GPU layer so we stay above the video's fullscreen
         hardware-overlay plane (which otherwise hides us after 1-2 s). */
      will-change: transform;
      transform: translateZ(0);
    }

    .watermark svg {
      height: 12px;
      width: auto;
      display: block;
    }

    .watermark .st0 { fill: #fff; }
    .watermark .st1 { fill: #1fa2ff; }

    .btn-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .toolbar {
      width: 100%;
      max-width: 640px;
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    button {
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      color: white;
      transition: background 0.2s;
    }

    button:disabled {
      background: #333;
      color: #666;
      cursor: default;
    }

    #startBtn {
      background: #2563eb;
    }

    #stopBtn {
      background: #dc2626;
    }

    #liveBtn {
      background: #059669;
      display: none;
    }

    #settingsBtn,
    #saveSettingsBtn,
    #fullscreenBtn {
      background: #374151;
    }

    #fullscreenBtn {
      padding: 0.75rem 1rem;
      font-size: 1.2rem;
    }

    .toggle-row {
      width: 100%;
      max-width: 640px;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .toggle input {
      width: 1rem;
      height: 1rem;
      accent-color: #2563eb;
    }

    #timeline-panel,
    #settings-panel,
    #log {
      width: 100%;
      max-width: 640px;
    }

    #timeline-panel,
    #settings-panel {
      display: none;
      flex-direction: column;
      gap: 0.5rem;
      background: #151515;
      border-radius: 0.75rem;
      padding: 0.9rem;
    }

    #settings-panel {
      gap: 0.85rem;
    }

    #settings-panel h2 {
      font-size: 0.9rem;
      opacity: 0.6;
      letter-spacing: 0.05em;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .field label {
      font-size: 0.82rem;
      opacity: 0.75;
    }

    .field input {
      width: 100%;
      border: 1px solid #2d2d2d;
      border-radius: 0.5rem;
      background: #111;
      color: #eee;
      padding: 0.75rem 0.85rem;
      font-size: 0.95rem;
    }

    #settings-note {
      font-size: 0.75rem;
      opacity: 0.55;
      line-height: 1.5;
    }

    #timeline-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      opacity: 0.75;
    }

    #dvrSlider {
      width: 100%;
      accent-color: #2563eb;
    }

    #timeline-status {
      font-size: 0.82rem;
      opacity: 0.75;
    }

    #log {
      font-size: 0.75rem;
      opacity: 0.55;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>

  <div class="toolbar">
      <button id="fullscreenBtn" type="button">⛶</button>
    <button id="settingsBtn" type="button">Settings</button>
  </div>

  <div class="btn-row">
    <button id="startBtn" disabled>Start Stream</button>
    <button id="stopBtn" disabled>Stop Stream</button>
    <button id="liveBtn">Go Live</button>
  </div>

  <div class="toggle-row">
    <label class="toggle">
      <input id="relayOnlyToggle" type="checkbox" />
      <span>Force relay/TURN only</span>
    </label>
    <label class="toggle">
      <input id="muteToggle" type="checkbox" />
      <span>Mute audio</span>
    </label>
  </div>

  <div id="settings-panel">
    <h2>SETTINGS</h2>
    <div class="field">
      <label for="nodeIdInput">Anedya Node ID</label>
      <input id="nodeIdInput" type="text" placeholder="Node UUID" autocomplete="off" />
    </div>
    <div class="field">
      <label for="apiKeyInput">Anedya API Key</label>
      <input id="apiKeyInput" type="password" placeholder="Bearer ..." autocomplete="off" />
    </div>
    <button id="saveSettingsBtn" type="button">Save Settings</button>
    <div id="settings-note">Node ID and API key are stored in this browser via localStorage. Prefix key with <code>Bearer</code> if your token needs it.</div>
  </div>

  <div id="timeline-panel">
    <div id="timeline-meta">
      <span id="timelineCurrent">00:00</span>
      <span id="timelineEnd">LIVE</span>
    </div>
    <input id="dvrSlider" type="range" min="0" max="0" step="0.1" value="0" disabled />
    <div id="timeline-status">Recording starts immediately. Playback appears after first finalized segment.</div>
  </div>

  <pre id="log"></pre>

  <!--
    zstd + trained-dictionary compression for signaling payloads.
    The offer (and the Pi's answer) are large WebRTC SDPs whose bulk is constant
    boilerplate. A shared trained dictionary lets each payload carry only its
    deltas, shrinking the value-store payload dramatically. This module exposes
    window.sdpCompress / sdpDecompress once the WASM + dictionary are ready.
    The dictionary bytes MUST match streamer/signaling_dict.bin on the device.
  -->
  <script type="module">
    import { init, createCCtx, compressUsingDict, createDCtx, decompressUsingDict }
      from './vendor/zstd/index.web.js';

    const ZSTD_LEVEL = 19;
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    const bytesToB64 = (u8) => {
      let s = '';
      for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
      return btoa(s);
    };
    const b64ToBytes = (b64) => {
      const bin = atob(b64);
      const u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      return u8;
    };

    // Resolves once WASM is initialized and the dictionary is loaded. Signaling
    // code awaits this before compressing/decompressing.
    window.zstdReady = (async () => {
      await init();
      const dict = new Uint8Array(
        await (await fetch('./vendor/zstd-dict.bin')).arrayBuffer());

      // JSON string -> base64(zstd-with-dict)
      window.sdpCompress = (jsonStr) =>
        bytesToB64(compressUsingDict(createCCtx(), encoder.encode(jsonStr), dict, ZSTD_LEVEL));

      // base64(zstd-with-dict) -> JSON string
      window.sdpDecompress = (b64) =>
        decoder.decode(decompressUsingDict(createDCtx(), b64ToBytes(b64), dict));
    })();
  </script>

  <script>
    /*
      Browser-side viewer.

      Responsibilities:
      1. Ask Anedya for TURN credentials.
      2. Create WebRTC offer.
      3. Write offer into Anedya value store.
      4. Poll for device answer.
      5. Use data channel for control messages.
    */

    // UI references.
    const statusEl = document.getElementById('status');
    const deviceStatusEl = document.getElementById('deviceStatus');
    const networkModeEl = document.getElementById('networkMode');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const liveBtn = document.getElementById('liveBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const relayOnlyToggle = document.getElementById('relayOnlyToggle');
    const muteToggle = document.getElementById('muteToggle');
    const settingsPanel = document.getElementById('settings-panel');
    const nodeIdInput = document.getElementById('nodeIdInput');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const video = document.getElementById('video');
    const logEl = document.getElementById('log');
    const timelinePanel = document.getElementById('timeline-panel');
    const dvrSlider = document.getElementById('dvrSlider');
    const timelineCurrent = document.getElementById('timelineCurrent');
    const timelineEnd = document.getElementById('timelineEnd');
    const timelineStatus = document.getElementById('timeline-status');

    const ANEDYA_API_BASE = 'https://api.ap-in-1.anedya.io/v1';
    const STORAGE_KEYS = {
      nodeId: 'pi-cam.anedyaNodeId',
      apiKey: 'pi-cam.anedyaApiKey',
      relayOnly: 'pi-cam.relayOnly',
    };

    // Per-browser-session state.
    let pc = null;
    let dc = null;
    let pollTimer = null;
    let timelineTimer = null;
    let timelineRenderTimer = null;
    let latestTimeline = null;
    let timelineReadyLogged = false;
    let draggingSlider = false;
    let lastSeekTime = 0;

    function uiLog(msg) {
      logEl.textContent += msg + '\n';
    }

    function getApiKey() {
      return localStorage.getItem(STORAGE_KEYS.apiKey)?.trim() || '';
    }

    function getNodeId() {
      return localStorage.getItem(STORAGE_KEYS.nodeId)?.trim() || '';
    }

    function getVsHeaders() {
      const apiKey = getApiKey();
      if (!apiKey) {
        throw new Error('Missing API key');
      }
      return {
        'Content-Type': 'application/json',
        'Accept': 'application/json',
        'Authorization': "Bearer " + apiKey,
      };
    }

    function getVsNamespace() {
      const nodeId = getNodeId();
      if (!nodeId) {
        throw new Error('Missing node ID');
      }
      return { scope: 'node', id: nodeId };
    }

    function relayOnlyEnabled() {
      return relayOnlyToggle?.checked ?? false;
    }

    function syncSettingsUI() {
      nodeIdInput.value = localStorage.getItem(STORAGE_KEYS.nodeId) || '';
      apiKeyInput.value = localStorage.getItem(STORAGE_KEYS.apiKey) || '';
      if (relayOnlyToggle) {
        relayOnlyToggle.checked = localStorage.getItem(STORAGE_KEYS.relayOnly) === 'true';
      }
    }

    function formatTime(totalSeconds) {
      const seconds = Math.max(0, Math.floor(totalSeconds));
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      if (h > 0) return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function resetUI() {
      video.srcObject = null;
      latestTimeline = null;
      timelineReadyLogged = false;
      networkModeEl.textContent = 'Mode: --';
      networkModeEl.className = '';
      startBtn.disabled = false;
      stopBtn.disabled = true;
      liveBtn.style.display = 'none';
      timelinePanel.style.display = 'none';
      dvrSlider.disabled = true;
      dvrSlider.value = 0;
      dvrSlider.max = 0;
      timelineCurrent.textContent = '00:00';
      timelineEnd.textContent = 'LIVE';
      timelineStatus.textContent = 'Recording starts immediately. Playback appears after first finalized segment.';
      statusEl.textContent = 'Ready - press Start';
      statusEl.className = 'connected';
    }

    function stopStream() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      if (timelineTimer) { clearInterval(timelineTimer); timelineTimer = null; }
      if (timelineRenderTimer) { clearInterval(timelineRenderTimer); timelineRenderTimer = null; }
      if (pc) { pc.close(); pc = null; }
      dc = null;
      uiLog('Stream stopped');
      resetUI();
    }

    function toggleSettingsPanel() {
      settingsPanel.style.display = settingsPanel.style.display === 'flex' ? 'none' : 'flex';
    }

    function sendCmd(cmd) {
      if (dc && dc.readyState === 'open') {
        dc.send(JSON.stringify(cmd));
      }
    }

    function getDisplayedTimelinePosition() {
      if (!latestTimeline) return 0;
      if (latestTimeline.mode === 'playback' || latestTimeline.mode === 'gap') {
        const elapsed = (performance.now() - latestTimeline.receivedAt) / 1000;
        return Math.min(latestTimeline.position + elapsed, latestTimeline.duration);
      }
      return latestTimeline.duration;
    }

    function updateTimelineDisplay() {
      if (!latestTimeline || draggingSlider) return;

      const duration = latestTimeline.duration;
      const position = getDisplayedTimelinePosition();

      dvrSlider.disabled = duration <= 0;
      dvrSlider.max = duration;
      dvrSlider.value = Math.min(position, duration);
      timelineCurrent.textContent = formatTime(Number(dvrSlider.value || 0));
      timelineEnd.textContent = duration > 0 ? formatTime(duration) : 'LIVE';

      if (duration <= 0) {
        timelineStatus.textContent = 'Recording starts immediately. Playback appears after first finalized segment.';
      } else if (latestTimeline.mode === 'live') {
        timelineStatus.textContent = 'Live mode';
        if (Date.now() - lastSeekTime > 3000) {
          liveBtn.style.display = 'none';
        }
      } else if (latestTimeline.mode === 'gap') {
        timelineStatus.textContent = 'No recording available';
        liveBtn.style.display = 'inline-block';
      } else {
        const behindLive = Math.max(0, duration - position);
        timelineStatus.textContent = `Playback mode - ${formatTime(behindLive)} behind live`;
        liveBtn.style.display = 'inline-block';
      }
    }

    function renderTimeline(msg) {
      timelinePanel.style.display = 'flex';

      const duration = Number(msg.duration || 0);
      const position = Number(msg.playback_offset ?? duration);
      latestTimeline = {
        mode: msg.mode,
        duration,
        position,
        receivedAt: performance.now(),
      };

      updateTimelineDisplay();

      if (duration <= 0) {
        timelineStatus.textContent = 'Recording starts immediately. Playback appears after first finalized segment.';
        liveBtn.style.display = 'none';
        return;
      }

      if (msg.mode === 'live') {
        timelineStatus.textContent = 'Live mode';
        if (Date.now() - lastSeekTime > 3000) {
          liveBtn.style.display = 'none';
        }
      } else if (msg.mode === 'gap') {
        timelineStatus.textContent = 'No recording available';
        liveBtn.style.display = 'inline-block';
      } else {
        const behindLive = Math.max(0, duration - position);
        timelineStatus.textContent = `Playback mode - ${formatTime(behindLive)} behind live`;
        liveBtn.style.display = 'inline-block';
      }
    }

    function setNetworkMode(mode) {
      networkModeEl.textContent = `Mode: ${mode}`;
      networkModeEl.className = mode === 'TURN' ? 'turn' : mode === 'P2P' ? 'p2p' : '';
    }

    // Data channel controls only the device-side playback mode.
    liveBtn.addEventListener('click', () => {
      sendCmd({ cmd: 'live' });
      uiLog('Switched to live');
    });

    dvrSlider.addEventListener('input', () => {
      draggingSlider = true;
      timelineCurrent.textContent = formatTime(Number(dvrSlider.value || 0));
    });

    dvrSlider.addEventListener('change', () => {
      draggingSlider = false;
      const offset = Number(dvrSlider.value || 0);
      sendCmd({ cmd: 'seek', offset });
      latestTimeline = {
        mode: 'playback',
        duration: Number(dvrSlider.max || 0),
        position: offset,
        receivedAt: performance.now(),
      };
      updateTimelineDisplay();
      uiLog(`Seeking to ${formatTime(offset)}`);
      lastSeekTime = Date.now();
      liveBtn.style.display = 'inline-block';
    });

    async function vsSet(key, value) {
      const resp = await fetch(`${ANEDYA_API_BASE}/valuestore/setValue`, {
        method: 'POST',
        headers: getVsHeaders(),
        body: JSON.stringify({ namespace: getVsNamespace(), key, value, type: 'string' }),
      });
      if (!resp.ok) {
        const text = await resp.text();
        throw new Error(`vsSet failed: ${resp.status} - ${text}`);
      }
    }

    async function vsGet(key) {
      const resp = await fetch(`${ANEDYA_API_BASE}/valuestore/getValue`, {
        method: 'POST',
        headers: getVsHeaders(),
        body: JSON.stringify({ namespace: getVsNamespace(), key }),
      });
      if (!resp.ok) return null;
      const json = await resp.json();
      if (!json.value) return null;
      return json.value;
    }

    // --- WebRTC signaling over Anedya Commands -----------------------------
    // The offer is sent as the "webrtc_offer" command; the Pi replies by
    // attaching the compressed answer SDP as this command's ackdata.

    // Send the compressed offer as a command. Returns the Anedya-assigned
    // commandId, which correlates the answer back to this offer.
    async function sendOfferViaCommand(dataB64) {
      const resp = await fetch(`${ANEDYA_API_BASE}/commands/send`, {
        method: 'POST',
        headers: getVsHeaders(),
        body: JSON.stringify({
          nodeId: getNodeId(),
          command: 'webrtc_offer',
          data: dataB64,
          // "string": the compressed offer base64 (~570 B) is well under the
          // 1023-char cap. (Binary type mangles the inbound command payload on
          // the device side, so we keep the offer as string.)
          type: 'string',
          expiry: Date.now() + 300_000,
        }),
      });
      if (!resp.ok) {
        throw new Error(`Command send failed: ${resp.status} ${await resp.text()}`);
      }
      const json = await resp.json();
      // Field name has varied across API versions; accept whichever is present.
      const commandId = json.commandId || json.id || json.commandID;
      if (!commandId) {
        throw new Error(`Command send returned no id: ${JSON.stringify(json)}`);
      }
      return commandId;
    }

    // Poll a command's details: status + ackdata (base64(zstd(answer SDP))).
    async function getCommandStatus(commandId) {
      const resp = await fetch(`${ANEDYA_API_BASE}/commands/getDetails`, {
        method: 'POST',
        headers: getVsHeaders(),
        body: JSON.stringify({ commandId }),
      });
      if (!resp.ok) return null;
      return await resp.json();
    }

    async function fetchTurnCredentials() {
      const resp = await fetch(`${ANEDYA_API_BASE}/relay/create`, {
        method: 'POST',
        headers: getVsHeaders(),
        body: JSON.stringify({ relayType: 'turn' }),
      });
      if (!resp.ok) throw new Error(`TURN fetch failed: ${resp.status}`);
      const json = await resp.json();
      if (!json.relayData) throw new Error(json.error || 'no relayData');
      return {
        ...json.relayData,
        password: json.relayData.credential,
        relayExpiry: json.relayExpiry,
      };
    }

    // --- Device online/offline status -------------------------------------
    // The Pi heartbeats Anedya every ~30 s. We ask Anedya's health API whether
    // the node has been seen within DEVICE_STATUS_THRESHOLD_SECONDS, both as a
    // live badge (polled) and as a gate before starting a stream.
    const DEVICE_STATUS_THRESHOLD_SECONDS = 90;
    const DEVICE_STATUS_POLL_MS = 10000;
    let deviceStatusTimer = null;

    // Returns { online, lastHeartbeat } for the configured node, or throws.
    async function fetchNodeHealth() {
      const nodeId = getNodeId();
      const resp = await fetch(`${ANEDYA_API_BASE}/health/status`, {
        method: 'POST',
        headers: getVsHeaders(),
        body: JSON.stringify({
          nodes: [nodeId],
          lastContactThreshold: DEVICE_STATUS_THRESHOLD_SECONDS,
        }),
      });
      if (!resp.ok) throw new Error(`Health check failed: ${resp.status}`);
      const json = await resp.json();
      if (json.success === false) {
        throw new Error(json.error || json.reasonCode || 'health error');
      }
      const info = json.data?.[nodeId];
      if (!info) throw new Error('health API returned no data for this node');
      return info;
    }

    function setDeviceStatus(state, text) {
      deviceStatusEl.className = state; // 'online' | 'offline' | 'unknown'
      deviceStatusEl.textContent = text;
    }

    // Refresh the badge once. Never throws — network/config problems just show
    // as "unknown" so the poller keeps running.
    async function refreshDeviceStatus() {
      if (!getNodeId()) { setDeviceStatus('unknown', 'Device: set Node ID'); return; }
      if (!getApiKey()) { setDeviceStatus('unknown', 'Device: set API key'); return; }
      try {
        const info = await fetchNodeHealth();
        if (info.online) {
          const t = info.lastHeartbeat
            ? new Date(info.lastHeartbeat * 1000).toLocaleTimeString()
            : '—';
          setDeviceStatus('online', `Device: ONLINE (last ${t})`);
        } else {
          const t = info.lastHeartbeat
            ? new Date(info.lastHeartbeat * 1000).toLocaleString()
            : 'never';
          setDeviceStatus('offline', `Device: OFFLINE (last ${t})`);
        }
      } catch (err) {
        setDeviceStatus('unknown', 'Device: status unknown');
      }
    }

    // Start (or restart) the background poll. Call after settings change.
    function startDeviceStatusPolling() {
      if (deviceStatusTimer) clearInterval(deviceStatusTimer);
      refreshDeviceStatus();
      deviceStatusTimer = setInterval(refreshDeviceStatus, DEVICE_STATUS_POLL_MS);
    }

    function buildIceConfig(relayData) {
      /*
        PeerConnection config for browser side.

        Browser and device both use same TURN allocation details. This allows
        connection through NAT even when direct P2P is not possible.
      */
      return {
        iceTransportPolicy: relayOnlyEnabled() ? 'relay' : 'all',
        iceServers: [{
          urls: [
            // TODO : Dont hardcode these - get from API
            'stun:turn1.ap-in-1.anedya.io:3478',
            'turn:turn1.ap-in-1.anedya.io:3478'
          ],
          username: relayData.username,
          credential: relayData.password
        }],
      };
    }

    settingsBtn.addEventListener('click', toggleSettingsPanel);

    fullscreenBtn.addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) {
          // Fullscreen the whole document (not the <video> or its container) so
          // Chrome does NOT promote the video to a hardware overlay plane that
          // hides the watermark. The `fs` body class (toggled below) then
          // expands the video container to fill the screen.
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (err) {
        uiLog('Fullscreen error: ' + err.message);
      }
    });

    // Keep the `fs` class in sync with actual fullscreen state so it also clears
    // when the user exits via Esc (which fires no button click).
    document.addEventListener('fullscreenchange', () => {
      document.body.classList.toggle('fs', !!document.fullscreenElement);
    });

    saveSettingsBtn.addEventListener('click', () => {
      const nodeId = nodeIdInput.value.trim();
      const value = apiKeyInput.value.trim();
      if (nodeId) {
        localStorage.setItem(STORAGE_KEYS.nodeId, nodeId);
      } else {
        localStorage.removeItem(STORAGE_KEYS.nodeId);
      }
      if (value) {
        localStorage.setItem(STORAGE_KEYS.apiKey, value);
      } else {
        localStorage.removeItem(STORAGE_KEYS.apiKey);
      }
      if (relayOnlyToggle) {
        localStorage.setItem(STORAGE_KEYS.relayOnly, String(relayOnlyToggle.checked));
      }
      uiLog(`Settings saved (${nodeId ? 'node set' : 'node missing'}, ${value ? 'key set' : 'key missing'})`);
      settingsPanel.style.display = 'none';
      // Re-check device status immediately against the new node/key.
      startDeviceStatusPolling();
    });

    relayOnlyToggle?.addEventListener('change', () => {
      localStorage.setItem(STORAGE_KEYS.relayOnly, String(relayOnlyToggle.checked));
    });

    muteToggle.addEventListener('change', () => {
      video.muted = muteToggle.checked;
    });

    startBtn.addEventListener('click', async () => {
      if (!getNodeId()) {
        uiLog('Missing node ID');
        statusEl.textContent = 'Missing node ID';
        statusEl.className = 'error';
        settingsPanel.style.display = 'flex';
        return;
      }

      if (!getApiKey()) {
        uiLog('Missing API key');
        statusEl.textContent = 'Missing API key';
        statusEl.className = 'error';
        settingsPanel.style.display = 'flex';
        return;
      }

      startBtn.disabled = true;
      stopBtn.disabled = false;
      statusEl.className = '';

      // Step 0: bail out early if the Pi is offline — no point handshaking a
      // device that has not heartbeated recently.
      statusEl.textContent = 'Checking device status...';
      try {
        const info = await fetchNodeHealth();
        if (!info.online) {
          const last = info.lastHeartbeat
            ? new Date(info.lastHeartbeat * 1000).toLocaleString()
            : 'never';
          setDeviceStatus('offline', `Device: OFFLINE (last ${last})`);
          uiLog(`Device is OFFLINE (last heartbeat: ${last})`);
          statusEl.textContent = 'Device offline';
          statusEl.className = 'error';
          resetUI();
          return;
        }
        setDeviceStatus('online', 'Device: ONLINE');
      } catch (err) {
        uiLog('Device status check failed: ' + err.message);
        statusEl.textContent = 'Status check failed';
        statusEl.className = 'error';
        resetUI();
        return;
      }

      statusEl.textContent = 'Fetching TURN credentials...';

      // Step 1: browser asks Anedya for TURN credentials.
      let relayData;
      try {
        relayData = await fetchTurnCredentials();
        uiLog(`TURN ready (expires ${new Date(relayData.relayExpiry * 1000).toLocaleTimeString()})`);
      } catch (err) {
        uiLog('TURN error: ' + err.message);
        statusEl.textContent = 'Error';
        statusEl.className = 'error';
        resetUI();
        return;
      }

      // Step 2: browser creates peer connection and data channel.
      pc = new RTCPeerConnection(buildIceConfig(relayData));
      dc = pc.createDataChannel('control', { ordered: true });

      dc.onopen = () => {
        uiLog('DataChannel open - requesting timeline');
        timelinePanel.style.display = 'flex';
        sendCmd({ cmd: 'timeline' });

        // Timeline is polled so browser UI updates while recording window grows.
        timelineTimer = setInterval(() => sendCmd({ cmd: 'timeline' }), 2000);
        timelineRenderTimer = setInterval(updateTimelineDisplay, 250);
      };

      dc.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'timeline') {
            if (!timelineReadyLogged) {
              uiLog('Timeline ready');
              timelineReadyLogged = true;
            }
            renderTimeline(msg);
          } else if (msg.type === 'error') {
            uiLog('Error: ' + msg.message);
          }
        } catch (err) {
          uiLog('DataChannel message error: ' + err.message);
        }
      };

      // Browser receives media only. Device sends video/audio.
      const videoTransceiver = pc.addTransceiver('video', { direction: 'recvonly' });
      pc.addTransceiver('audio', { direction: 'recvonly' });

      // Prefer H.264 when browser supports codec preference ordering.
      if (RTCRtpReceiver.getCapabilities) {
        const { codecs } = RTCRtpReceiver.getCapabilities('video');
        const h264 = codecs.filter(c => c.mimeType === 'video/H264');
        const rest = codecs.filter(c => c.mimeType !== 'video/H264');
        if (h264.length) {
          try {
            videoTransceiver.setCodecPreferences([...h264, ...rest]);
            uiLog('Codec: H.264 preferred');
          } catch (e) {
            uiLog('setCodecPreferences not supported - using browser default');
          }
        }
      }

      pc.ontrack = (e) => {
        uiLog('Got remote track: ' + e.track.kind);
        if (e.streams && e.streams[0]) {
          video.srcObject = e.streams[0];
          statusEl.textContent = 'Streaming';
          statusEl.className = 'connected';
        }
      };

      pc.onconnectionstatechange = async () => {
        uiLog('PC state: ' + pc.connectionState);
        if (pc.connectionState === 'connected') {
          const stats = await pc.getStats();
          stats.forEach(report => {
            if (report.type === 'candidate-pair' && report.state === 'succeeded') {
              const local = stats.get(report.localCandidateId);
              const remote = stats.get(report.remoteCandidateId);
              if (local?.candidateType === 'relay' || remote?.candidateType === 'relay') {
                uiLog('Candidate type: TURN');
                setNetworkMode('TURN');
              } else {
                uiLog('Candidate type: P2P');
                setNetworkMode('P2P');
              }
            }
          });
        } else if (pc.connectionState === 'failed') {
          statusEl.textContent = 'Connection failed';
          statusEl.className = 'error';
          stopStream();
        }
      };

      // Step 3: create offer and wait until all local ICE candidates are gathered.
      statusEl.textContent = 'Gathering ICE...';
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      // TODO
      await new Promise(resolve => {
        if (pc.iceGatheringState === 'complete') { resolve(); return; }
        pc.onicegatheringstatechange = () => {
          if (pc.iceGatheringState === 'complete') resolve();
        };
      });

      const hasRelayCandidates = pc.localDescription.sdp.split('\n').some(
        l => l.trim().startsWith('a=candidate:') && l.includes('typ relay')
      );
      if (!hasRelayCandidates) {
        uiLog('Warning: Failed to create relay candidate. Please check your quota limits.');
      }

      // Step 4: send the offer as the "webrtc_offer" command.
      let commandId;
      try {
        statusEl.textContent = 'Sending offer...';
        await window.zstdReady;
        const offerJson = JSON.stringify({
          offer: { sdp: pc.localDescription.sdp, type: pc.localDescription.type },
          turn: relayData
        });
        // Compress (zstd + shared dict) + base64; the Pi decompresses with the
        // identical dictionary. This is what makes a full media SDP fit a command.
        const payload = window.sdpCompress(offerJson);
        uiLog(`Offer: raw=${offerJson.length}B -> command payload=${payload.length}B`);
        commandId = await sendOfferViaCommand(payload);
        uiLog(`Offer sent (commandId=${commandId}) - polling for answer...`);
        statusEl.textContent = 'Waiting for Pi...';
      } catch (err) {
        uiLog('Error sending offer: ' + err.message);
        statusEl.textContent = 'Error';
        statusEl.className = 'error';
        resetUI();
        return;
      }

      // Step 5: poll the command status. The Pi attaches the compressed answer
      // SDP as ackdata while status is "processing", then concludes success/failure.
      let attempts = 0;
      let answerApplied = false;
      const MAX_ATTEMPTS = 45;
      pollTimer = setInterval(async () => {
        attempts++;
        if (attempts > MAX_ATTEMPTS) {
          clearInterval(pollTimer); pollTimer = null;
          if (!answerApplied) {
            uiLog('Timeout: Pi did not respond in time');
            statusEl.textContent = 'Timeout';
            statusEl.className = 'error';
            stopStream();
          }
          return;
        }

        try {
          const cmd = await getCommandStatus(commandId);
          if (!cmd) { uiLog(`Status fetch failed (${attempts})`); return; }

          if (cmd.status === 'failure') {
            clearInterval(pollTimer); pollTimer = null;
            uiLog(`Command status=failure: ${cmd.ackdata || cmd.error || ''}`);
            statusEl.textContent = 'Pi reported failure';
            statusEl.className = 'error';
            stopStream();
            return;
          }
          if (cmd.status === 'success') {
            clearInterval(pollTimer); pollTimer = null;
            uiLog('Command status=success (Pi confirmed connection)');
            return;
          }

          // The answer SDP rides in ackdata while status is "processing".
          if (!answerApplied && cmd.ackdata) {
            answerApplied = true;
            // Same compression as the offer, reversed.
            const answerSdp = JSON.parse(window.sdpDecompress(cmd.ackdata));
            await pc.setRemoteDescription(new RTCSessionDescription(answerSdp));
            uiLog('Answer applied - WebRTC connecting...');
          }
        } catch (err) {
          uiLog('Poll/apply answer error: ' + err.message);
        }
      }, 2000);
    });

    stopBtn.addEventListener('click', stopStream);

    statusEl.textContent = 'Ready - press Start';
    statusEl.className = 'connected';
    startBtn.disabled = false;
    syncSettingsUI();
    startDeviceStatusPolling();
  </script>
</body>

</html>
